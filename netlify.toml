[build]
  publish = "public"
  functions = "netlify/functions"
[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/insights"
  to = "/.netlify/functions/blog"
  status = 200
[[redirects]]
  from = "/insights/:slug"
  to = "/.netlify/functions/blog?slug=:slug"
  status = 200
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/blog?sitemap=1"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self' https:; connect-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'"
